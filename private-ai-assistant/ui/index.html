<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private AI Assistant</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #101c2f;
      --panel-2: #16243a;
      --text: #edf4ff;
      --muted: #93a4ba;
      --accent: #2dd4bf;
      --accent-2: #38bdf8;
      --danger: #fb7185;
      --border: #27364d;
      --user: #155e75;
      --assistant: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, "Aptos", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(45, 212, 191, 0.20), transparent 28rem),
        radial-gradient(circle at 80% 0%, rgba(56, 189, 248, 0.16), transparent 24rem),
        linear-gradient(135deg, #08111f 0%, #0b1320 45%, #111827 100%);
    }

    button, input, textarea { font: inherit; }

    button {
      border: 0;
      border-radius: 0.85rem;
      padding: 0.8rem 1rem;
      color: #03131d;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 750;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    button.danger {
      color: white;
      background: var(--danger);
    }

    button:disabled { opacity: 0.55; cursor: not-allowed; }

    input, textarea {
      width: 100%;
      color: var(--text);
      background: #0a1322;
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      outline: none;
      padding: 0.9rem 1rem;
    }

    input:focus, textarea:focus { border-color: var(--accent); }

    .hidden { display: none !important; }

    #login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .login-card {
      width: min(430px, 100%);
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      background: rgba(16, 28, 47, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .login-card h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
    .login-card p { margin: 0 0 1.5rem; color: var(--muted); }
    .form-stack { display: grid; gap: 0.85rem; }
    .error { color: var(--danger); min-height: 1.4rem; }

    #app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 340px;
    }

    main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    header {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 17, 31, 0.78);
      backdrop-filter: blur(16px);
    }

    header h1 { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; }
    .header-actions { display: flex; gap: 0.65rem; align-items: center; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      width: fit-content;
      max-width: min(780px, 86%);
      padding: 0.95rem 1.05rem;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 1rem;
      line-height: 1.55;
      white-space: normal;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--user), #0f766e);
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(31, 41, 55, 0.88);
    }

    .message pre {
      overflow-x: auto;
      padding: 1rem;
      border-radius: 0.75rem;
      background: #050b14;
    }

    .message code {
      color: #bae6fd;
      background: rgba(255,255,255,0.06);
      padding: 0.1rem 0.25rem;
      border-radius: 0.3rem;
    }

    .message pre code { background: transparent; padding: 0; }

    #input-container {
      padding: 1rem 1.25rem;
      background: rgba(16, 28, 47, 0.92);
      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }

    #msg { resize: none; max-height: 180px; }

    aside {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: rgba(16, 28, 47, 0.72);
    }

    .side-header, .side-section { padding: 1rem; border-bottom: 1px solid var(--border); }
    .side-header h2 { margin: 0 0 0.25rem; font-size: 1rem; }
    .side-header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .side-section h3 { margin: 0 0 0.75rem; font-size: 0.92rem; }

    #memory-list {
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      gap: 0.75rem;
    }

    .memory-card {
      padding: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      background: rgba(8, 17, 31, 0.54);
      color: var(--muted);
    }

    .memory-card strong { color: var(--text); }

    @media (max-width: 880px) {
      #app-shell { grid-template-columns: 1fr; }
      aside { display: none; }
      header { gap: 0.75rem; align-items: flex-start; flex-direction: column; }
      .message { max-width: 96%; }
    }
  </style>
</head>
<body>
  <section id="login-screen">
    <form id="login-form" class="login-card">
      <h1>Private AI Assistant</h1>
      <p>Local login protects chat, uploads, and memory APIs.</p>
      <div class="form-stack">
        <input id="username" name="username" placeholder="Username" autocomplete="username" required>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Login</button>
        <div id="login-error" class="error"></div>
      </div>
    </form>
  </section>

  <section id="app-shell" class="hidden">
    <main>
      <header>
        <div>
          <h1>Private AI Assistant</h1>
          <div id="status" style="color: var(--muted); font-size: 0.9rem;">Local RAG + persistent memory</div>
        </div>
        <div class="header-actions">
          <button class="secondary" id="refresh-memory-btn">Refresh Memory</button>
          <button class="danger" id="logout-btn">Logout</button>
        </div>
      </header>

      <div id="chat-container">
        <div class="message assistant">Login active. Ask a question, upload a document, or add memory from the side panel.</div>
      </div>

      <div id="input-container">
        <div class="input-wrapper">
          <input type="file" id="file-upload" class="hidden" accept=".pdf,.docx,.txt,.json">
          <button class="secondary" id="upload-btn" title="Upload Document">Upload</button>
          <textarea id="msg" rows="1" placeholder="Type your message..."></textarea>
          <button id="send-btn">Send</button>
        </div>
      </div>
    </main>

    <aside>
      <div class="side-header">
        <h2>Memory Space</h2>
        <p>Stored locally in <code>/data/memory.json</code>.</p>
      </div>
      <div class="side-section">
        <h3>Add Memory Fact</h3>
        <div class="form-stack">
          <textarea id="memory-text" rows="4" placeholder="Example: Prefer direct technical answers with commands first."></textarea>
          <input id="memory-tags" placeholder="Tags, comma separated">
          <button id="add-memory-btn">Store Memory</button>
        </div>
      </div>
      <div id="memory-list"></div>
    </aside>
  </section>

  <script>
    let history = [];
    const loginScreen = document.getElementById('login-screen');
    const appShell = document.getElementById('app-shell');
    const chatContainer = document.getElementById('chat-container');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    document.getElementById('login-form').addEventListener('submit', login);
    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('send-btn').addEventListener('click', send);
    document.getElementById('upload-btn').addEventListener('click', () => document.getElementById('file-upload').click());
    document.getElementById('file-upload').addEventListener('change', uploadFile);
    document.getElementById('add-memory-btn').addEventListener('click', addMemoryFact);
    document.getElementById('refresh-memory-btn').addEventListener('click', loadMemory);

    msgInput.addEventListener('input', () => {
      msgInput.style.height = '';
      msgInput.style.height = msgInput.scrollHeight + 'px';
    });

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    checkSession();

    async function checkSession() {
      const res = await fetch('/session');
      const data = await res.json();
      if (data.authenticated) showApp();
    }

    async function login(e) {
      e.preventDefault();
      const error = document.getElementById('login-error');
      error.textContent = '';
      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };
      const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        error.textContent = data.detail || 'Login failed';
        return;
      }
      showApp();
    }

    async function logout() {
      await fetch('/logout', {method: 'POST'});
      history = [];
      appShell.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    }

    function showApp() {
      loginScreen.classList.add('hidden');
      appShell.classList.remove('hidden');
      msgInput.focus();
      loadMemory();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[char]));
    }

    function renderAssistant(text) {
      const escaped = escapeHtml(text);
      const withBlocks = escaped.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      return withBlocks
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (role === 'assistant') div.innerHTML = renderAssistant(content);
      else div.textContent = content;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function uploadFile(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file) return;
      const assistantDiv = addMessage('assistant', 'Uploading and indexing document...');
      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/upload', {method: 'POST', body: formData});
        const data = await res.json();
        if (!res.ok || data.status !== 'success') throw new Error(data.detail || data.message || 'Upload failed');
        assistantDiv.innerHTML = renderAssistant(`${data.message}. Chunks indexed: ${data.chunks || 0}`);
        await loadMemory();
      } catch (err) {
        assistantDiv.textContent = `Upload failed: ${err.message}`;
      }
      input.value = '';
    }

    async function send() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = '';
      msgInput.style.height = '';
      sendBtn.disabled = true;
      statusEl.textContent = 'Thinking...';

      addMessage('user', text);
      const assistantDiv = addMessage('assistant', 'Thinking...');
      let assistantText = '';
      let buffer = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ message: text, history }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || 'Network response was not ok');
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        assistantDiv.innerHTML = '';

        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, {stream: true});
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (!line.trim()) continue;
            const data = JSON.parse(line);
            if (data.response) {
              assistantText += data.response;
              assistantDiv.innerHTML = renderAssistant(assistantText);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          }
        }
      } catch (err) {
        assistantText = `Error: ${err.message}`;
        assistantDiv.textContent = assistantText;
      }

      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: assistantText });
      if (history.length > 12) history = history.slice(-12);
      sendBtn.disabled = false;
      statusEl.textContent = 'Local RAG + persistent memory';
      msgInput.focus();
      loadMemory();
    }

    async function loadMemory() {
      const list = document.getElementById('memory-list');
      try {
        const res = await fetch('/memory');
        if (!res.ok) return;
        const memory = await res.json();
        const profile = memory.profile || {};
        const facts = memory.facts || [];
        const conversations = memory.conversations || [];
        list.innerHTML = '';
        addMemoryCard(list, 'Profile', `${profile.name || ''}\n${profile.role || ''}\nSkills: ${(profile.skills || []).join(', ')}`);
        facts.slice(-10).reverse().forEach((fact) => addMemoryCard(list, 'Fact', fact.text || ''));
        conversations.slice(-5).reverse().forEach((turn) => addMemoryCard(list, 'Conversation', `User: ${turn.user || ''}\nAssistant: ${(turn.assistant || '').slice(0, 280)}`));
      } catch (_) {
        list.textContent = 'Unable to load memory.';
      }
    }

    function addMemoryCard(list, title, body) {
      const card = document.createElement('div');
      card.className = 'memory-card';
      const strong = document.createElement('strong');
      strong.textContent = title;
      const content = document.createElement('div');
      content.textContent = body;
      card.appendChild(strong);
      card.appendChild(content);
      list.appendChild(card);
    }

    async function addMemoryFact() {
      const textEl = document.getElementById('memory-text');
      const tagsEl = document.getElementById('memory-tags');
      const text = textEl.value.trim();
      if (!text) return;
      const tags = tagsEl.value.split(',').map((tag) => tag.trim()).filter(Boolean);
      const res = await fetch('/memory/facts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text, tags}),
      });
      if (res.ok) {
        textEl.value = '';
        tagsEl.value = '';
        loadMemory();
      }
    }
  </script>
</body>
</html>
