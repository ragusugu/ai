<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Private AI Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --user-msg: #3b82f6;
      --ai-msg: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --border: #334155;
    }
    body {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem 2rem;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .message {
      max-width: 80%;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 0.25rem;
    }
    .message.assistant {
      align-self: flex-start;
      background-color: var(--ai-msg);
      border-bottom-left-radius: 0.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .message p { margin-top: 0; }
    .message p:last-child { margin-bottom: 0; }
    .message pre {
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
    }
    .message code {
      font-family: 'Fira Code', monospace;
      font-size: 0.9em;
    }
    #input-container {
      padding: 1.5rem 2rem;
      background: var(--chat-bg);
      border-top: 1px solid var(--border);
    }
    .input-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      display: flex;
      gap: 1rem;
    }
    #msg {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    #msg:focus {
      border-color: #3b82f6;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 1rem;
      padding: 0 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #2563eb; }
    button:active { transform: scale(0.95); }
    button:disabled { background: #475569; cursor: not-allowed; }
    .icon-btn {
      background: transparent;
      color: var(--text);
      font-size: 1.5rem;
      padding: 0 0.5rem;
    }
    .icon-btn:hover {
      background: transparent;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Private AI Assistant</h1>
    <div style="font-size: 0.9rem; color: var(--text-muted)">Powered by local RAG</div>
  </header>
  
  <div id="chat-container">
    <div class="message assistant">
      Hi! I'm your private AI assistant. How can I help you today?
    </div>
  </div>

  <div id="input-container">
    <div class="input-wrapper">
      <input type="file" id="file-upload" style="display: none" onchange="uploadFile(this)" accept=".pdf,.docx,.txt,.json">
      <button class="icon-btn" onclick="document.getElementById('file-upload').click()" title="Upload Document">📁</button>
      <textarea id="msg" rows="1" placeholder="Type your message here..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
      <button id="send-btn" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    let history = [];
    const chatContainer = document.getElementById('chat-container');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send-btn');

    // Handle Enter to send
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = role === 'assistant' ? marked.parse(content) : content;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function uploadFile(input) {
      const file = input.files[0];
      if (!file) return;

      const assistantDiv = addMessage('assistant', '<span style="color:#94a3b8">Uploading and indexing document...</span>');
      
      const formData = new FormData();
      formData.append("file", file);
      
      try {
        const res = await fetch("/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.status === "success") {
          assistantDiv.innerHTML = `✅ Successfully ingested <b>${file.name}</b>. I can now answer questions about it!`;
        } else {
          assistantDiv.innerHTML = `❌ Error: ${data.message}`;
        }
      } catch (err) {
        assistantDiv.innerHTML = `❌ Upload failed: ${err.message}`;
      }
      input.value = ""; // clear
    }

    async function send() {
      const text = msgInput.value.trim();
      if (!text) return;

      msgInput.value = '';
      msgInput.style.height = '';
      sendBtn.disabled = true;

      addMessage('user', text);
      const assistantDiv = addMessage('assistant', '<span style="color:#94a3b8">Thinking...</span>');
      let assistantText = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ message: text, history: history })
        });

        if (!res.ok) throw new Error("Network response was not ok");

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        assistantDiv.innerHTML = ""; // clear thinking

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunkStr = decoder.decode(value, { stream: true });
          // Handle potential multiple JSON objects in one chunk
          const lines = chunkStr.split('\\n').filter(line => line.trim() !== '');
          
          for (const line of lines) {
            try {
              const data = JSON.parse(line);
              if (data.response) {
                assistantText += data.response;
                assistantDiv.innerHTML = marked.parse(assistantText);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              }
            } catch (e) {
              // Not every chunk boundary aligns perfectly with JSON lines.
              // A more robust implementation would buffer the text.
              console.error("Error parsing JSON chunk:", e, line);
            }
          }
        }
      } catch (err) {
        assistantText = "Error: " + err.message;
        assistantDiv.innerText = assistantText;
      }

      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: assistantText });
      
      // Keep history limited to last 10 messages to avoid context overflow
      if (history.length > 10) {
        history = history.slice(history.length - 10);
      }
      
      sendBtn.disabled = false;
      msgInput.focus();
    }
  </script>
</body>
</html>
