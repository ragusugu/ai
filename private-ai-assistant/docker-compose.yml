services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-app
    environment:
      MODEL_NAME: ${MODEL_NAME:-gemma4:12b}
      MEMORY_PATH: /data/memory.json
      DOCS_DIR: /data/docs
      OLLAMA_URL: http://ollama:11434/api/generate
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-backend
    environment:
      APP_BASE_URL: http://app:8000
      DEFAULT_MODEL: ${MODEL_NAME:-gemma4:12b}
      AI_USERNAME: ${AI_USERNAME:-sugan}
      AI_PASSWORD: ${AI_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-local-secret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama:
