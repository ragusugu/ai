services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]

  backend:
    image: python:3.11-slim
    container_name: ai-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./ui:/app/ui
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  app:
    build: .
    container_name: ai-app
    working_dir: /app
    environment:
      - MODEL_NAME=gemma4:12b
    volumes:
      - ./data:/data
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - ollama

volumes:
  ollama:
